name: daily snapshot
on:
  schedule:
    # 15:00 UTC: the 2026-11-11 snapshot was taken at 14:22 UTC and its newest day was already final;
    # a fetch at 07:38 UTC (2026-11-12) got a newest day DefiLlama had not finished filling.
    # GitHub can start a scheduled run hours late (2026-11-23's 15:00 run started at 02:00 UTC the next
    # day, when DefiLlama's series and its own total30d disagreed by one day). The second cron retries a day
    # whose first run failed or never came; runs before 12:00 UTC are skipped.
    - cron: "0 15 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: snapshot
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Fetch raw public data (no API key), at most once per UTC day
        id: fetch
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%-H)" -lt 12 ]; then
            echo "::notice::$(date -u +%H:%M) UTC is too early: the sources have not finished the previous day"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -d "data/raw/$(date -u +%F)" ]; then
            echo "data/raw/$(date -u +%F) is already committed; a committed snapshot is never overwritten"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            python -m replicated.fetch
          fi
      - name: Re-evaluate the kill conditions, list restated days, update the page
        if: steps.fetch.outputs.skip != 'true'
        run: |
          python -m replicated.history || echo "::warning::a kill condition fails on the new snapshot"
          python -m replicated.compare
          python -m replicated.page
      - name: Tests, including the integrity of the new snapshot
        if: steps.fetch.outputs.skip != 'true'
        run: python -m unittest discover -s tests
      - name: Commit the snapshot
        if: steps.fetch.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw out/history.md out/history.json out/replication.md out/replication.json docs/index.html
          git diff --cached --quiet || git commit -m "Snapshot $(date -u +%F)"
          git push
